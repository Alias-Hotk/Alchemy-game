name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.x

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Build Executable
        run: |
          pyinstaller --onefile AlchemPy.py

      - name: Create Profiles Directory
        run: |
          mkdir profiles

      - name: Move Data Files
        run: |
          mv cable.dat profiles/
          mv gnomik.dat profiles/
          mv leon.dat profiles/
          mv saveli.dat profiles/

      - name: Create Release Archive
        run: |
          zip -r release.zip AlchemPy.exe Recipes.dat profiles/

      - name: Upload Release
        uses: actions/upload-artifact@v2
        with:
          name: Release
          path: release.zip

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: ${{ github.event.inputs.release_name }}
          body: |
            Release created by GitHub Actions.
          draft: false
          prerelease: false
